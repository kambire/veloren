[package]
name = "veloren-updater"
version = "0.2.0"
edition = "2024"
authors = ["Veloren MMORPG Team"]
description = "Lanzador y actualizador automático de World of Azeria"
build = "build.rs"

[dependencies]
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
# Interfaz: dibujo 2D con suavizado y texto con las fuentes del juego
tiny-skia = "0.11"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
