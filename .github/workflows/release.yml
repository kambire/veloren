name: Build and Release Game Client

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-client:
    name: Build World of Azeria Client (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Game Binary
        run: cargo build --release --bin WorldOfAzeria --bin AzeriaLauncher

      - name: Prepare Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "target\release\WorldOfAzeria.exe" -Destination "dist\"
          Copy-Item -Path "target\release\AzeriaLauncher.exe" -Destination "dist\"
          Copy-Item -Path "assets" -Destination "dist\assets" -Recurse
          Compress-Archive -Path "dist\*" -DestinationPath "WorldOfAzeria-windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: WorldOfAzeria-windows.zip
          name: "World of Azeria ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
